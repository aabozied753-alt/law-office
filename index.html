<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مكتب المحاماة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: slim navy bar, navy hero with the five court sections as large tiles, sub pages are search + owner-editable entry lists. */
:root{
  --font-display:"Amiri","Traditional Arabic",Georgia,serif;
  --font-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  --bg:#EEF1F5;
  --surface:#FFFFFF;
  --surface-2:#E4E9F0;
  --ink:#14233A;
  --muted:#55657C;
  --line:#CBD4E0;
  --navy:#14233A;
  --on-navy:#F2F5FA;
  --on-navy-muted:#B7C3D6;
  --brass:#8F6A1F;
  --brass-hi:#D8B567;
  --btn-bg:#14233A;
  --btn-fg:#FFFFFF;
  --danger:#9B2C3A;
  --focus:#B88A2E;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#09121F;--surface:#101D33;--surface-2:#172A47;--ink:#E8EDF5;--muted:#9DB0C8;--line:#24395A;
    --navy:#0D1A2E;--on-navy:#F2F5FA;--on-navy-muted:#A9B8CE;--brass:#D8B567;
    --btn-bg:#D8B567;--btn-fg:#14233A;--danger:#EC8F9A;--focus:#D8B567;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#09121F;--surface:#101D33;--surface-2:#172A47;--ink:#E8EDF5;--muted:#9DB0C8;--line:#24395A;
  --navy:#0D1A2E;--on-navy:#F2F5FA;--on-navy-muted:#A9B8CE;--brass:#D8B567;
  --btn-bg:#D8B567;--btn-fg:#14233A;--danger:#EC8F9A;--focus:#D8B567;color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.7}
#app{min-height:100vh}
.wrap{max-width:1040px;margin-inline:auto;padding-inline:16px}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* top bar */
.bar{background:var(--navy);color:var(--on-navy);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--font-display);font-size:22px;font-weight:700;min-width:0}
.brand span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mark{width:28px;height:28px;color:var(--brass-hi);flex:none}
.chip-role{font-size:13px;padding:2px 12px;border:1px solid var(--on-navy-muted);border-radius:999px;color:var(--on-navy);white-space:nowrap}
.chip-role.owner{border-color:var(--brass-hi);color:var(--brass-hi)}

/* hero */
.hero{background:var(--navy);color:var(--on-navy);padding-block:36px 44px}
.hero h1{font-family:var(--font-display);font-size:clamp(34px,6.5vw,60px);line-height:1.2;margin:0 0 10px;text-wrap:balance}
.en-name{font-family:var(--font-display);font-size:clamp(20px,3.6vw,28px);letter-spacing:.04em;color:var(--brass-hi);margin:0 0 12px;text-align:start;unicode-bidi:isolate;direction:ltr;width:fit-content}
.hero p{margin:0;color:var(--on-navy-muted);max-width:60ch;font-size:18px}
.rule{width:64px;height:3px;background:var(--brass-hi);margin-block:18px 0;border:0}
.hero-edit{margin-top:18px}
.hero .field label{color:var(--on-navy-muted)}
.hero input{background:var(--surface);color:var(--ink)}

/* headings, crumbs */
.crumbs{display:flex;flex-wrap:wrap;gap:6px;font-size:14px;color:var(--muted);padding-top:24px}
.crumbs a{color:var(--muted);text-decoration:none}
.crumbs a:hover{color:var(--brass);text-decoration:underline}
.crumbs [aria-current]{color:var(--ink)}
h2.sec-title{font-family:var(--font-display);font-size:30px;margin:28px 0 14px}
.page-title{font-family:var(--font-display);font-size:clamp(30px,5vw,44px);line-height:1.25;margin:8px 0 6px;text-wrap:balance}
.lede{margin:0 0 20px;color:var(--muted);max-width:60ch}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px;padding-bottom:40px}
.tile{display:grid;gap:6px;align-content:start;padding:22px;background:var(--surface);border:1px solid var(--line);border-radius:6px;text-decoration:none;min-height:150px;transition:transform .15s,border-color .15s}
.tile:hover{border-color:var(--brass);transform:translateY(-2px)}
.tile .ico{width:34px;height:34px;color:var(--brass)}
.tile h3{font-family:var(--font-display);font-size:26px;line-height:1.3;margin:6px 0 0}
.tile p{margin:0;color:var(--muted);font-size:15px}
.tile .count{margin-top:6px;font-size:13px;color:var(--brass);font-weight:600}
.tiles.compact .tile{min-height:120px}

/* toolbar + buttons */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.search{flex:1 1 220px;min-width:0}
input[type=text],input[type=search],input[type=email],input[type=password],textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:9px 12px}
textarea{min-height:140px;resize:vertical;line-height:1.8}
.btn{font:inherit;font-weight:600;cursor:pointer;border:1px solid transparent;border-radius:5px;padding:9px 18px;background:var(--btn-bg);color:var(--btn-fg)}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--brass)}
.btn.small{padding:5px 12px;font-size:14px;font-weight:500}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn.on-navy{background:transparent;color:var(--on-navy);border-color:var(--on-navy-muted)}
.meta-line{color:var(--muted);font-size:14px;margin:0 0 12px}

/* form */
.panel{background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--brass);border-radius:6px;padding:18px;margin-bottom:18px}
.panel h3{font-family:var(--font-display);font-size:24px;margin:0 0 12px}
.field{display:grid;gap:4px;margin-bottom:14px}
.field label{font-weight:600;font-size:15px}
.field .hint{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.err{color:var(--danger);font-size:14px;min-height:0}
.form-actions{display:flex;flex-wrap:wrap;gap:10px}

/* entries */
.list{display:grid;gap:10px;padding-bottom:48px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:6px}
.item[open]{border-color:var(--brass)}
.item summary{list-style:none;cursor:pointer;display:flex;align-items:flex-start;gap:12px;justify-content:space-between;padding:14px 16px}
.item summary::-webkit-details-marker{display:none}
.item summary::after{content:"‹";font-size:24px;line-height:1;color:var(--brass);transition:transform .15s;flex:none;margin-top:2px}
.item[open] summary::after{transform:rotate(-90deg)}
.sum-main{display:grid;gap:4px;min-width:0;flex:1}
.item-title{font-weight:600;font-size:18px;overflow-wrap:anywhere}
.chip{justify-self:start;font-size:13px;color:var(--brass);border:1px solid var(--line);border-radius:999px;padding:0 10px;overflow-wrap:anywhere}
.preview{margin:0;color:var(--muted);font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.item[open] .preview{display:none}
.item-body{padding:4px 16px 14px;white-space:pre-wrap;line-height:2;overflow-wrap:anywhere}
.item-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.item-foot .acts{display:flex;gap:8px}
.item .edit-host{padding:14px 16px}
.empty{border:1px dashed var(--line);border-radius:6px;padding:28px 18px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--font-display);font-size:22px;margin-bottom:4px}

/* gate */
.gate{max-width:480px;margin:56px auto;padding:28px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--brass);border-radius:6px;text-align:center}
.gate .ico{width:40px;height:40px;color:var(--brass)}
.gate h2{font-family:var(--font-display);font-size:30px;margin:8px 0}
.gate p{color:var(--muted);margin:0 0 8px}
.loading{padding:64px 16px;text-align:center;color:var(--muted)}

/* toast */
.toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));margin-inline:auto;width:fit-content;max-width:min(92vw,420px);background:var(--navy);color:var(--on-navy);padding:10px 18px;border-radius:6px;font-size:15px;z-index:20}
.toast.bad{background:var(--danger);color:#fff}
@media (prefers-reduced-motion:reduce){.tile,.item summary::after{transition:none}.tile:hover{transform:none}}
html{color-scheme:light}body{margin:0}
.bar-actions{display:flex;align-items:center;gap:8px}
a.btn{text-decoration:none;display:inline-block}
.login-form{display:grid;gap:4px;text-align:start;margin-top:14px}
.gate .btn{width:100%}
.gate p a{color:var(--brass)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-self:start}
.ext{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--btn-fg);background:var(--btn-bg);border-radius:4px;padding:0 8px;line-height:22px}
.file-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px;margin:0 16px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.file-row.removed{opacity:.5;text-decoration:line-through}
.file-row .fname{flex:1 1 160px;min-width:0;overflow-wrap:anywhere;font-weight:500}
.file-row .fsize{color:var(--muted);font-size:13px}
.field .file-row{margin:0 0 8px}
input[type=file]{width:100%;font:inherit;color:var(--ink)}
.linkbtn{background:none;border:0;color:var(--brass);font:inherit;cursor:pointer;text-decoration:underline;padding:4px}
.gate-links{display:grid;gap:2px;margin-top:12px}
.bar-actions{flex-wrap:wrap;justify-content:flex-end}
select,input[type=number],input[type=tel]{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:9px 12px}
.chip.price{color:var(--btn-fg);background:var(--btn-bg);border-color:transparent;font-weight:600}
.lock-block{margin:0 16px 10px}
.lock-block .file-row{margin:0 0 8px}
.lock-area{display:grid;gap:8px;justify-items:start}
.lock-area .meta-line{margin:0}
.panel.buy{margin:0 0 10px;width:100%}
.pay-list{display:grid;gap:8px;margin-bottom:12px}
.pay-item{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.pay-item span{overflow-wrap:anywhere;min-width:0}
.order{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:grid;gap:10px}
.order-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:8px}
.order-head h3{margin:0;font-size:18px;font-family:var(--font-body);overflow-wrap:anywhere}
.order-meta{color:var(--muted);font-size:14px;display:grid;gap:2px;overflow-wrap:anywhere}
.order-acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.order-acts input{flex:1 1 200px;min-width:0}
.st{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:0 10px;white-space:nowrap}
.st.pending{color:var(--brass);border-color:var(--brass)}
.st.approved{color:var(--ok);border-color:var(--ok)}
.st.rejected{color:var(--danger);border-color:var(--danger)}
:root{--ok:#2C7A4B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ok:#6FCF97}}
:root[data-theme="dark"]{--ok:#6FCF97}
</style>

var MAX_FILE=8*1024*1024, CHUNK=600*1024, ACCEPT=".pdf,.doc,.docx,.xls,.xlsx";
var ALLOWED_EXT=["pdf","doc","docx","xls","xlsx"];
var MIME={pdf:"application/pdf",doc:"application/msword",docx:"application/vnd.openxmlformats-officedocument.wordprocessingml.document",xls:"application/vnd.ms-excel",xlsx:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"};
function extOf(name){var m=/\.([A-Za-z0-9]+)$/.exec(name||"");return m?m[1].toLowerCase():"";}
function fmtSize(b){
 if(b<1048576)return Number(Math.max(1,Math.round(b/1024))).toLocaleString("ar-EG")+" ك.ب";
 return Number(b/1048576).toLocaleString("ar-EG",{maximumFractionDigits:1})+" م.ب";
}
function extChip(f){return h("span",{class:"ext",text:(extOf(f.name)||"ملف").toUpperCase()});}
function readB64(blob){
 return new Promise(function(res,rej){
  var r=new FileReader();
  r.onload=function(){var x=String(r.result);res(x.slice(x.indexOf(",")+1));};
  r.onerror=function(){rej(r.error||new Error("read"));};
  r.readAsDataURL(blob);
 });
}
function b64ToBytes(b){
 var bin=atob(b), n=bin.length, u=new Uint8Array(n);
 for(var i=0;i<n;i++)u[i]=bin.charCodeAt(i);
 return u;
}
function priceOf(it){var p=Number(it&&it.price);return p>0?p:0;}
function fmtPrice(p){return Number(p).toLocaleString("ar-EG")+" جنيه";}
function partRef(itemId,fid,i){return state.db.collection("files").doc(itemId).collection("parts").doc(fid+"_"+i);}
function deleteFileParts(f,itemId){
 var b=state.db.batch();
 for(var i=0;i<f.chunks;i++)b.delete(partRef(itemId,f.id,i));
 return b.commit();
}
function uploadFile(file,itemId,onProgress){
 var fid=state.db.collection("files").doc().id, n=Math.max(1,Math.ceil(file.size/CHUNK));
 var meta={id:fid,name:file.name,size:file.size,chunks:n};
 var p=Promise.resolve();
 for(var i=0;i<n;i++){
  (function(i){
   p=p.then(function(){return readB64(file.slice(i*CHUNK,(i+1)*CHUNK));})
    .then(function(b64){return partRef(itemId,fid,i).set({fid:fid,i:i,data:b64});})
    .then(function(){if(onProgress)onProgress(i+1,n);});
  })(i);
 }
 return p.then(function(){return meta;},function(e){deleteFileParts(meta,itemId).catch(function(){});throw e;});
}
function downloadFile(f,itemId){
 var reads=[];
 for(var i=0;i<f.chunks;i++)reads.push(partRef(itemId,f.id,i).get());
 return Promise.all(reads).then(function(snaps){
  var parts=snaps.map(function(sn){
   if(!sn.exists)throw new Error("missing");
   return b64ToBytes(sn.data().data);
  });
  var blob=new Blob(parts,{type:MIME[extOf(f.name)]||"application/octet-stream"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url;a.download=f.name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},60000);
 });
}
function fileRow(f,itemId){
 var btn=h("button",{type:"button",class:"btn small",text:"تحميل"});
 btn.addEventListener("click",function(){
  btn.disabled=true;btn.textContent="جارٍ التحميل…";
  downloadFile(f,itemId).catch(function(){toast("تعذر تحميل الملف، حاول مرة أخرى.",true);}).then(function(){btn.disabled=false;btn.textContent="تحميل";});
 });
 return h("div",{class:"file-row"},extChip(f),h("span",{class:"fname",text:f.name}),h("span",{class:"fsize",text:fmtSize(f.size)}),btn);
}

/* ---------- entry card ---------- */
function itemCard(it,cfg){
 var d=h("details",{class:"item"});
 var price=priceOf(it);

 d.addEventListener("toggle",function(){if(d.open)openIds[it.id]=1;else delete openIds[it.id];});

     if(it.file&&(vals.file||vals.removeFile))deleteFileParts(it.file,it.id).catch(function(){});

/* ---------- entry form with field checks ---------- */
var MAX_TITLE=200, MAX_REF=120, MAX_BODY=30000, MAX_PRICE=1000000;
function entryForm(cfg,init,onSave,onCancel){
 var id="f"+(++fid);
 var title=h("input",{type:"text",id:id+"t",maxlength:String(MAX_TITLE),autocomplete:"off"});
 var ref=h("input",{type:"text",id:id+"r",maxlength:String(MAX_REF),placeholder:cfg.refHint,autocomplete:"off"});
 var body=h("textarea",{id:id+"b",maxlength:String(MAX_BODY)});
 var priceIn=h("input",{type:"number",id:id+"p",min:"0",max:String(MAX_PRICE),step:"1",inputmode:"numeric",dir:"ltr"});
 var fileIn=h("input",{type:"file",id:id+"f",accept:ACCEPT});
 priceIn.value=init&&priceOf(init)?String(priceOf(init)):"0";
 if(init){title.value=init.title||"";ref.value=init.ref||"";body.value=init.body||"";}
 var eT=h("div",{class:"err",role:"alert"}), eB=h("div",{class:"err",role:"alert"}), eF=h("div",{class:"err",role:"alert"}), eP=h("div",{class:"err",role:"alert"});
 var cT=h("span"), cB=h("span");
 var curFile=init&&init.file?init.file:null, removed=false, curRow=null;
 var fieldFile=h("div",{class:"field"},h("label",{for:id+"f",text:"ملف مرفق (اختياري)"}));
 if(curFile){
  var rm=h("button",{type:"button",class:"btn ghost small",text:"إزالة الملف الحالي"});
  curRow=h("div",{class:"file-row"},extChip(curFile),h("span",{class:"fname",text:curFile.name}),h("span",{class:"fsize",text:fmtSize(curFile.size)}),rm);
  rm.addEventListener("click",function(){
   removed=!removed;
   rm.textContent=removed?"تراجع عن الإزالة":"إزالة الملف الحالي";
   curRow.classList.toggle("removed",removed);
   if(eB.textContent)checkBody();
   if(eP.textContent)checkPrice();
  });
  fieldFile.append(curRow);
 }
 fieldFile.append(fileIn,h("div",{class:"hint"},eF,h("span",{text:"Word أو Excel أو PDF، حتى "+fmtNum(MAX_FILE/1048576)+" ميجابايت"})));
 var fieldPrice=h("div",{class:"field"},h("label",{for:id+"p",text:"سعر الملف بالجنيه المصري"}),priceIn,
  h("div",{class:"hint"},eP,h("span",{text:"اترك 0 لو الملف مجاني. السعر يخص الملف المرفق فقط، والنص يظهر للجميع."})));
 function hasFile(){return !!((fileIn.files&&fileIn.files[0])||(curFile&&!removed));}
 function priceVal(){var t=priceIn.value.trim();return t===""?0:Number(t);}
 function grow(){body.style.height="auto";body.style.height=Math.min(body.scrollHeight+4,520)+"px";}
 function counts(){
  cT.textContent=fmtNum(title.value.length)+" / "+fmtNum(MAX_TITLE);
  cB.textContent=fmtNum(body.value.length)+" / "+fmtNum(MAX_BODY);
 }
 function checkTitle(){
  var ok=title.value.trim().length>=2;
  eT.textContent=ok?"":"اكتب "+cfg.titleLabel+" (حرفان على الأقل).";
  title.setAttribute("aria-invalid",ok?"false":"true");
  return ok;
 }
 function checkBody(){
  var ok=body.value.trim().length>=5||hasFile();
  eB.textContent=ok?"":"اكتب "+cfg.bodyLabel+" (خمسة أحرف على الأقل) أو أرفق ملفًا.";
  body.setAttribute("aria-invalid",ok?"false":"true");
  return ok;
 }
 function checkFile(){
  var f=fileIn.files&&fileIn.files[0], msg="";
  if(f){
   if(ALLOWED_EXT.indexOf(extOf(f.name))<0)msg="الملفات المسموحة: Word وExcel وPDF فقط.";
   else if(f.size===0)msg="الملف فارغ.";
   else if(f.size>MAX_FILE)msg="حجم الملف أكبر من "+fmtNum(MAX_FILE/1048576)+" ميجابايت.";
  }
  eF.textContent=msg;
  return !msg;
 }
 function checkPrice(){
  var v=priceVal(), msg="";
  if(!isFinite(v)||v<0||Math.floor(v)!==v||v>MAX_PRICE)msg="اكتب سعرًا بالجنيه بدون كسور (من 0 إلى "+fmtNum(MAX_PRICE)+").";
  else if(v>0&&!hasFile())msg="السعر يحتاج ملفًا مرفقًا. أرفق ملفًا أو اجعل السعر 0.";
  eP.textContent=msg;
  priceIn.setAttribute("aria-invalid",msg?"true":"false");
  return !msg;
 }
 title.addEventListener("input",function(){counts();if(eT.textContent)checkTitle();});
 body.addEventListener("input",function(){counts();grow();if(eB.textContent)checkBody();});

 title.addEventListener("blur",function(){if(title.value)checkTitle();});
 body.addEventListener("blur",function(){if(body.value)checkBody();});
 fileIn.addEventListener("change",function(){checkFile();if(eB.textContent)checkBody();if(eP.textContent)checkPrice();});
 var save=h("button",{type:"submit",class:"btn",text:init?"حفظ التعديل":"حفظ"});
 var cancel=h("button",{type:"button",class:"btn ghost",text:"إلغاء",onclick:onCancel});
 var saveLabel=save.textContent;
 var form=h("form",{novalidate:true},
  h("div",{class:"field"},h("label",{for:id+"t",text:cfg.titleLabel}),title,h("div",{class:"hint"},eT,cT)),
  h("div",{class:"field"},h("label",{for:id+"r",text:cfg.refLabel+" (اختياري)"}),ref),
  h("div",{class:"field"},h("label",{for:id+"b",text:cfg.bodyLabel}),body,h("div",{class:"hint"},eB,cB)),
  fieldFile,fieldPrice,
  h("div",{class:"form-actions"},save,cancel));
 form.addEventListener("submit",function(e){
  e.preventDefault();
  var a=checkTitle(), c=checkFile(), b=checkBody(), pr=checkPrice();
  if(!a){title.focus();return;}
  if(!b){body.focus();return;}
  if(!c){fileIn.focus();return;}
  if(!pr){priceIn.focus();return;}
  save.disabled=true;cancel.disabled=true;
  var f=fileIn.files&&fileIn.files[0]?fileIn.files[0]:null;
  onSave({title:title.value.trim(),ref:ref.value.trim(),body:body.value.trim(),price:priceVal(),file:f,removeFile:removed&&!f},function(t){save.textContent=t;}).catch(function(err){
   toast(dbMsg(err),true);save.disabled=false;cancel.disabled=false;save.textContent=saveLabel;
  });
 });

}

/* ---------- live data ---------- */
function refresh(){
 if(state.phase!=="ready")return;
 if(current==="orders"){if(state.owner)renderOrders();return;}
 var r=parse(current);
 if(r.v==="list")renderList();
 else if(!editingOffice)route();
}
function start(){
 route();
 var cfg=window.FIREBASE_CONFIG, fb=window.firebase;
 if(!cfg||!cfg.apiKey||String(cfg.apiKey).indexOf("PASTE")===0||!fb||!fb.initializeApp){state.phase="setup";route();return;}
 try{fb.initializeApp(cfg);}catch(e){}
 state.auth=fb.auth();
 state.db=fb.firestore();
 var require=window.REQUIRE_LOGIN_TO_VIEW===true;
 var unsubs=[];
 function unsubscribe(){
  unsubs.forEach(function(u){try{u();}catch(e){}});
  unsubs=[];state.loaded=false;state.items=[];state.purchases={};state.orders=[];state.payLoaded=false;
 }
 function subscribe(){
  unsubscribe();
  unsubs.push(state.db.collection("items").onSnapshot(function(snap){
   state.items=snap.docs.map(function(d){var x=d.data()||{};x.id=d.id;return x;}).filter(function(x){return typeof x.title==="string"&&typeof x.body==="string";});
   state.loaded=true;
   refresh();
  },function(){state.loaded=true;refresh();}));
  unsubs.push(state.db.doc("settings/office").onSnapshot(function(sn){
   if(sn.exists){
    var o=sn.data();
    if(o&&typeof o.name==="string"&&o.name)state.office.name=o.name;
    if(o&&typeof o.tagline==="string")state.office.tagline=o.tagline;
    if(o&&typeof o.en==="string")state.office.en=o.en;
   }
   renderBar();
   if(parse(current).v==="home"&&current!=="login"&&current!=="orders"&&!editingOffice&&state.phase==="ready")route();
  },function(){}));
  unsubs.push(state.db.doc("settings/payment").onSnapshot(function(sn){
   var o=sn.exists?sn.data():null, first=!state.payLoaded;
   state.pay={
    methods:o&&Array.isArray(o.methods)?o.methods.filter(function(m){return m&&typeof m.label==="string"&&typeof m.detail==="string";}):[],
    note:o&&typeof o.note==="string"?o.note:""
   };
   state.payLoaded=true;
   if(first&&current==="orders")fillPay();
   else if(current!=="orders")refresh();
  },function(){state.payLoaded=true;if(current==="orders")fillPay();}));
  if(state.user){
   unsubs.push(state.db.collection("purchases").where("uid","==",state.user.uid).onSnapshot(function(snap){
    var m={};
    snap.docs.forEach(function(d){var x=d.data()||{};if(x.itemId)m[x.itemId]=x;});
    state.purchases=m;
    refresh();
   },function(){}));
  }
 }
 var pingSeq=0;
 state.auth.onAuthStateChanged(function(u){
  state.user=u;state.owner=false;state.ownerChecked=false;
  var seq=++pingSeq;
  if(require&&!u){unsubscribe();state.phase="gate";route();return;}
  state.phase="ready";
  subscribe();
  if(u){
   /* القواعد تسمح بالكتابة للمالك فقط، فنجاح هذه الكتابة يعني أن الحساب هو حساب المالك */
   state.db.doc("settings/ping").set({t:Date.now()}).then(function(){
    if(seq!==pingSeq)return;
    state.owner=true;state.ownerChecked=true;
    unsubs.push(state.db.collection("purchases").onSnapshot(function(snap){
     state.orders=snap.docs.map(function(d){var x=d.data()||{};x.id=d.id;return x;});
     renderBar();
     if(current==="orders")renderOrders();
    },function(){}));
    route();
   }).catch(function(){
    if(seq!==pingSeq)return;
    state.ownerChecked=true;
    if(current==="orders")route();
   });
  }else{state.ownerChecked=true;}
  if(current==="login"&&u){go("home");return;}
  route();
 });
}
start();
})();
